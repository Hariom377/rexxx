<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Primary SEO -->
    <title>REXAM — Government Exams, Recruitments &amp; Scholarships Discovery</title>
    <meta name="description" content="Discover government job notifications, recruitment exams, scholarships and fellowships personalized for Indian college students and graduates. REXAM — India's smart exam discovery platform." />
    <meta name="keywords" content="government jobs, UPSC, SSC, Railway jobs, scholarships, government exams, India recruitment, sarkari naukri, PSU jobs, central government jobs" />
    <link rel="canonical" href="https://rexam.in" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="REXAM — Government Exams, Recruitments &amp; Scholarships Discovery" />
    <meta property="og:description" content="Discover government job notifications, recruitment exams and scholarships personalized for Indian students and graduates." />
    <meta property="og:url" content="https://rexam.in" />
    <meta property="og:image" content="https://rexam.in/og-image.jpg" />
    <meta property="og:site_name" content="REXAM" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="REXAM — Government Exams Discovery" />
    <meta name="twitter:description" content="Personalized government exam and scholarship discovery for Indian students." />
    <meta name="twitter:image" content="https://rexam.in/og-image.jpg" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "REXAM",
      "url": "https://rexam.in",
      "description": "India's personalized government examination, recruitment and scholarship discovery platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://rexam.in/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "REXAM",
      "url": "https://rexam.in",
      "logo": "https://rexam.in/logo.png",
      "sameAs": []
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-bg-primary text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
