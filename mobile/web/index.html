<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href is replaced by the value of the `--base-href` argument
    provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Primary Meta Tags -->
  <title>REXAM – Government Exams, Scholarships &amp; Student Opportunities</title>
  <meta name="title" content="REXAM – Government Exams, Scholarships &amp; Student Opportunities">
  <meta name="description" content="Discover government examinations, recruitment notifications and scholarships matching your education, qualifications and eligibility. Pan-India coverage.">
  <meta name="keywords" content="government exams India, UPSC, SSC, state PSC, scholarships, recruitment notifications, eligibility checker, government jobs">
  <meta name="author" content="REXAM">
  <meta name="robots" content="index, follow">

  <!-- Theme & PWA -->
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REXAM">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="REXAM – Government Exams, Scholarships &amp; Student Opportunities">
  <meta property="og:description" content="Discover government examinations, recruitment notifications and scholarships matching your education, qualifications and eligibility.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:site_name" content="REXAM">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="REXAM – Government Exams &amp; Scholarships">
  <meta name="twitter:description" content="Pan-India government exam and scholarship discovery for college students and graduates.">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Structured Data (JSON-LD) for Search & AEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "REXAM",
    "url": "https://rexam.in",
    "description": "Personalized government examination, recruitment and scholarship discovery platform for Indian college students, graduates and aspirants.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    }
  }
  </script>

  <style>
    /* Loading screen — matches REXAM dark theme */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-wordmark {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #242424;
      border-top-color: #22C55E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-tagline {
      color: #777777;
      font-size: 12px;
      font-weight: 500;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- REXAM loading screen shown before Flutter initializes -->
  <div id="loading-screen">
    <div class="loading-wordmark">REXAM</div>
    <div class="loading-spinner"></div>
    <div class="loading-tagline">Indian Examination &amp; Opportunity Intelligence</div>
  </div>

  <script>
    // Hide loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(function() {
          loadingScreen.style.display = 'none';
        }, 450);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
